services:
  nginx:
    image: jonasal/nginx-certbot:latest
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
  frontend:
    image: node:24-alpine
    working_dir: /usr/src/app
    command: node app.js
    volumes:
      - ./dist/frontend:/usr/src/app:ro
    depends_on:
      - backend
  backend:
    image: node:24-alpine
    working_dir: /usr/src/app
    command: node app.js
    volumes:
      - ./dist/backend:/usr/src/app:ro
    depends_on:
      - db
  db:
    image: postgres:latest
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  certs:
