services:
  # 1. THE GATEKEEPER (Handles SSL, Rate Limiting, and Routing)
  nginx:
    image: jonasal/nginx-certbot:latest
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend

  # 2. THE FRONTEND (Internal Web Server for Angular static files)
  frontend:
    image: nginx:alpine
    volumes:
      - ./dist/frontend:/usr/share/nginx/html:ro
      - ./frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # 3. THE BACKEND (Your Node.js API)
  backend:
    image: node:24-alpine
    working_dir: /usr/src/app
    command: node app.js
    volumes:
      - ./dist/backend:/usr/src/app:ro
    depends_on:
      - db

  # 4. THE DATABASE
  db:
    image: postgres:latest
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  certs:
