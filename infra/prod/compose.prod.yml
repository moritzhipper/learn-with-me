services:
  nginx:
    image: jonasal/nginx-certbot:latest
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../infra/nginx.conf:/etc/nginx/user_conf.d/lingolizard.conf:ro
      - certs:/etc/letsencrypt
    env_file: ./../../.env
    depends_on:
      - frontend
      - backend

  frontend:
    image: nginx:alpine
    volumes:
      - ../dist/frontend/browser:/usr/share/nginx/html:ro
      - ../infra/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    image: node:24-alpine
    working_dir: /usr/src/app
    command: node app.js
    env_file: ./../../.env
    volumes:
      - ../dist/backend:/usr/src/app:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: wget -qO- http://localhost:$$BACKEND_PORT/health || exit 1
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: postgres:latest
    env_file: ./../../.env
    volumes:
      - pgdata:/var/lib/postgresql
      - ../infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  certs:
