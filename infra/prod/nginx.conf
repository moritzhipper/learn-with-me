limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=frontend:10m rate=50r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name lingolizard.com www.lingolizard.com;

    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:3000;
    set $frontend_upstream http://frontend:4200;

    ssl_certificate /etc/letsencrypt/live/lingolizard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingolizard.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location /api/ {
        valid_referers none blocked server_names;
        if ($invalid_referer) {
            return 403;
        }
        
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass $backend_upstream/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=frontend burst=50 nodelay;
        limit_req_status 429;

        proxy_pass $frontend_upstream;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}