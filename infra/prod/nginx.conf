server {
    listen 443 ssl http2;
    server_name lingolizard.com www.lingolizard.com;

    ssl_certificate /etc/letsencrypt/live/lingolizard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingolizard.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location /api/ {
        valid_referers none blocked server_names;
        if ($invalid_referer) {
            return 403;
        }
        
        proxy_pass http://backend:3000/; 

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Fallback for Angular
        proxy_intercept_errors on;
        error_page 404 =200 /index.html;
    }
}