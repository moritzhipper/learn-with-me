limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=frontend:10m rate=50r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name lingolizard.com www.lingolizard.com;

    ssl_certificate /etc/letsencrypt/live/lingolizard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingolizard.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Global Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5; # Level 6 has diminishing returns vs CPU usage
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Global Proxy Settings
    proxy_http_version 1.1;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:3000;
    set $frontend_upstream http://frontend:80;

    location /api/ {
        # Rate Limiting
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        # API Security: Limit payload size and connection times
        client_max_body_size 5m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 20s;

        # Upstream proxy definitions
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend_upstream;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Rate Limiting
        limit_req zone=frontend burst=50 nodelay;
        limit_req_status 429;

        proxy_pass $frontend_upstream;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}