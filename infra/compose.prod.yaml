services:
  nginx:
    image: jonasal/nginx-certbot:latest
    ports:
      - '80:80' # certbot challenge
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
  frontend:
    build: ./dist/frontend
    depends_on:
      - backend
  backend:
    build: ./dist/backend
    depends_on:
      - db
  db:
    image: postgres:latest
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  certs:
