services:
  nginx:
    image: nginx:latest
    ports:
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro # todo
    depends_on:
      - frontend
      - backend
  frontend:
    build: ./dist/frontend
  backend:
    build: ./dist/backend
    env_file:
      - ./../.env
  db:
    image: postgres:latest
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
