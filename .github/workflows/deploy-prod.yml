name: Deploy to Prod

on:
  push:
    branches: ['develop']

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_CONN: ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}
      SSH_CMD: ssh -i ~/.ssh/deploy_key -p ${{ secrets.REMOTE_PORT }}
      REMOTE_DIR: /home/${{ secrets.REMOTE_USER }}/lingolizard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # - name: Test
      #   run: |
      #     npm test
      - name: Install Dependencies
        run: npm ci -f # remove as soon as ngrx is officially angular 22 compatible
      - name: Build Frontend
        run: npm run build:fe:prod
      - name: Build Backend
        run: npm run build:be:prod
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
      - name: Backup Current State
        run: |
          $SSH_CMD $SSH_CONN "
            rm -rf $REMOTE_DIR.bak
            [ -d $REMOTE_DIR ] && cp -a $REMOTE_DIR $REMOTE_DIR.bak || echo 'No existing deployment, skipping backup'
          "
      - name: Deploy Files
        run: |
          rsync -rlgoDzvc -i --delete --mkpath -e "$SSH_CMD" \
            dist/ $SSH_CONN:$REMOTE_DIR/dist/
          rsync -rlgoDzvc -i --delete --mkpath -e "$SSH_CMD" \
            infra/prod/ $SSH_CONN:$REMOTE_DIR/infra/
      - name: Apply Compose
        id: compose
        run: |
          $SSH_CMD $SSH_CONN "bash $REMOTE_DIR/infra/apply-compose.sh"
      - name: Rollback on Failure
        if: failure() && steps.compose.outcome == 'failure'
        run: |
          $SSH_CMD $SSH_CONN "bash $REMOTE_DIR/infra/rollback-compose.sh"
