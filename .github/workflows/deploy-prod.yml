name: Deploy to Prod

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # - name: Test
      #   run: |
      #     npm test
      - name: Install Dependencies
        run: npm ci
      - name: Build Frontend
        run: npm run build:fe:prod
      - name: Build Backend
        run: npm run build:be:prod
      - name: Deploy
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}
          ARGS: '-rlgoDzvc -i --delete'
          SOURCE: 'dist/ infra/prod/'
          SCRIPT_AFTER: |
            # sync docker compose
            # apply nginx config
            # use docker compose -d to start the services in detached mode
            # add health check to backend docker compose service
            # switch old deploy to new deploy
