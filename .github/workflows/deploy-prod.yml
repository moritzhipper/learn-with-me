name: Deploy to Prod

on:
  push:
    branches: ['add_prod_build']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_CONN: ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}
      SSH_CMD: ssh -i ~/.ssh/deploy_key -p ${{ secrets.REMOTE_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # - name: Test
      #   run: |
      #     npm test
      - name: Install Dependencies
        run: npm ci
      - name: Build Frontend
        run: npm run build:fe:prod
      - name: Build Backend
        run: npm run build:be:prod
      - name: Generate .env file
        run: echo "${{ secrets.ENV }}" > infra/prod/.env
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy Files
        run: |
          rsync -rlgoDzvc -i --delete \
            -e "$SSH_CMD" \
            dist infra/prod/ \
            $SSH_CONN:/home/deployer/lingolizard
      - name: Apply Compose
        run: |
          $SSH_CMD $SSH_CONN "bash /home/deployer/lingolizard/apply-compose.sh"
