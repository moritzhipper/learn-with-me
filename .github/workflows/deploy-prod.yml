name: Deploy to Prod

on:
  push:
    branches: ['add_prod_build']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # - name: Test
      #   run: |
      #     npm test
      - name: Install Dependencies
        run: npm ci
      - name: Build Frontend
        run: npm run build:fe:prod
      - name: Build Backend
        run: npm run build:be:prod
      - name: Deploy
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          ARGS: '-rlgoDzvc -i --delete'
          SOURCE: 'dist/ infra/prod/'
          TARGET: /home/deployer/lingolizard
          SCRIPT_AFTER: bash /home/deployer/lingolizard/infra/prod/apply-compose.sh
