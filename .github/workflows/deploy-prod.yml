name: Deploy to Prod

on:
  push:
    branches: ['add_prod_build']

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_CONN: ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}
      SSH_CMD: ssh -i ~/.ssh/deploy_key -p ${{ secrets.REMOTE_PORT }}
      REMOTE_DIR: /home/${{ secrets.REMOTE_USER }}/lingolizard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # - name: Test
      #   run: |
      #     npm test
      - name: Install Dependencies
        run: npm ci
      - name: Build Frontend
        run: npm run build:fe:prod
      - name: Build Backend
        run: npm run build:be:prod
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
      - name: Backup Current Dist
        run: |
          $SSH_CMD $SSH_CONN "
            cd $REMOTE_DIR &&
            rm -rf dist.bak &&
            [ -d dist ] && cp -a dist dist.bak || true
          "
      - name: Deploy Files
        run: |
          rsync -rlgoDzvc -i --delete \
            -e "$SSH_CMD" \
            dist infra/prod/ \
            $SSH_CONN:$REMOTE_DIR
      - name: Apply Compose
        id: compose
        run: |
          $SSH_CMD $SSH_CONN "bash $REMOTE_DIR/apply-compose.sh"
      - name: Rollback on Failure
        if: failure() && steps.compose.outcome == 'failure'
        run: |
          $SSH_CMD $SSH_CONN "
            cd $REMOTE_DIR &&
            if [ -d dist.bak ]; then
              echo 'Rolling back to previous dist...' &&
              rm -rf dist &&
              mv dist.bak dist &&
              docker compose -f compose.prod.yml down --timeout 30 || true &&
              docker compose -f compose.prod.yml up -d --wait
            else
              echo 'No backup found — cannot rollback'
            fi
          "
