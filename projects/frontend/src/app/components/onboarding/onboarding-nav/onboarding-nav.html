<button class="big back" [disabled]="activePage() === 0" (click)="back()">Back</button>
<button
  class="big next"
  [disabled]="disableNext()"
  [class.primary]="activePage() === pageCount() - 1"
  (click)="next()"
>
  @let index = activePage();
  @for (label of labels(); track label) {
    @if ($index === index) {
      <span animate.leave="leave">
        {{ label }}
      </span>
    }
  }
</button>
