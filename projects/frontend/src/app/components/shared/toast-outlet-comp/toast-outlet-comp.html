@for (toast of toasts(); track toast) {
  <div class="toast" [class]="toast.type" animate.enter="toast-in" animate.leave="toast-out">
    <div class="wrapper">
      @if (toast.header) {
        <div class="header ellipsis">
          {{ toast.header }}
        </div>
      }
      <p>
        {{ toast.message }}
      </p>
      @if (toast.type === 'info') {
        <ng-icon [svg]="icons.infoIcon" />
      } @else {
        <ng-icon [svg]="icons.warningIcon" />
      }
    </div>
  </div>
}
