@for (toast of toasts(); track toast) {
  <div class="toast" [class]="toast.type" animate.enter="toast-in" animate.leave="toast-out">
    <div class="wrapper">
      @if (toast.header) {
        <div class="header ellipsis">
          {{ toast.header }}
        </div>
      }
      <div>
        {{ toast.message }}
      </div>
    </div>
  </div>
}
