<div class="practices">
  @for (marker of dates(); track marker) {
    <div class="interval practice" [style.--days-ago]="marker.intervall">
      @if (marker.type === 'practice') {
        <div class="dot"></div>
      } @else {
        <div class="dot">s</div>
      }
    </div>
  }
</div>
<div class="scale">
  @for (interval of SPACED_REP_INTERVALS; track interval) {
    <div class="interval marker" [style.--days-ago]="interval">{{ interval }}</div>
  }
</div>
