<div class="timeline practice">
  @for (marker of dates(); track marker) {
    <div class="marker" [style.--days-ago]="marker.intervall">
      @if (marker.type === 'practice') {
        <app-icon-comp type="drop-fill" />
      } @else {
        <app-icon-comp type="drop" />
      }
    </div>
  }
</div>
<div class="timeline scale">
  @for (interval of SPACED_REP_INTERVALS; track interval) {
    <div class="marker" [style.--days-ago]="interval">{{ interval }}</div>
  }
</div>
