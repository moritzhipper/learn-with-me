@for (action of quickActions(); track $index) {
  <button class="silent quick caroussel-item">
    @switch (action.type) {
      @case ('continue') {
        <h3>Continue practice</h3>
        <p>{{ action.cardsLeft }} cards left until you're done!</p>
      }
      @case ('collection') {
        <h3>{{ action.collection.name }} <span class="type"> Spaced Rep </span></h3>

        <p>Improve your confidence in this collection.</p>
        <app-spaced-repetition-timeline [dates]="action.practiceDates" />
      }
      @case ('added-by-day') {
        <h3>
          {{ action.dateAddedUTC | date: 'mediumDate' }}
          <span class="type">Added By Day</span>
        </h3>
        <p class="size-0">
          Maximize learning effectiveness by catching the spaced repetition interval exactly.
        </p>
        <app-spaced-repetition-timeline [dates]="action.practiceDates" />
      }
      @case ('worst-cards') {
        <h3>Most potential</h3>
        <p>
          <strong>{{ action.learnableIds.length }}</strong> cards |
          <strong> {{ action.averageScore }}% </strong> average
        </p>
        <p class="size-0">
          Focus on the cards with the lowest average score to boost your overall confidence.
        </p>
      }
      @case ('customize') {
        <h3>Customize everything</h3>
        <p class="size-0">Customize your practice session exactly how you want to.</p>
      }
    }
    <app-icon-comp type="learn" />
  </button>
}
