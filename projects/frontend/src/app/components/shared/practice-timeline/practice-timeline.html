@for (day of practiceHistory(); track day) {
  @if (day.guessed === 0) {
    <div class="day empty"></div>
  } @else {
    <button class="day" [style.--guessed]="day.guessed" (click)="selectDay.emit(day.day)">
      <p class="size-0" [class.inside]="day.guessed > 15">
        {{ day.guessed }}
      </p>
    </button>
  }
}
