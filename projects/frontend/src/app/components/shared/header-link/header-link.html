<a [routerLink]="route()" [queryParams]="queryParams()" [class.eyebrow]="eyebrow()">
  @if (eyebrow()) {
    <ng-icon name="remixArrowDownSLine" />
    <div class="text">
      {{ label() }}
    </div>
  } @else {
    <h2>
      {{ label() }}
    </h2>
    <ng-icon name="remixArrowDownSLine" />
  }
</a>
