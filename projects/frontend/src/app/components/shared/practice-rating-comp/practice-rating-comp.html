@switch (confidence()) {
  @case ('noteven') {
    <ng-icon name="remixHeartsFill" />
  }
  @case ('atleast') {
    <ng-icon name="remixStarFill" />
    <ng-icon name="remixStarLine" />
    <ng-icon name="remixStarLine" />
  }
  @case ('okay') {
    <ng-icon name="remixStarFill" />
    <ng-icon name="remixStarLine" />
    <ng-icon name="remixStarFill" />
  }
  @case ('good') {
    <ng-icon name="remixStarFill" />
    <ng-icon name="remixStarFill" />
    <ng-icon name="remixStarFill" />
  }
  @case ('excellent') {
    <ng-icon name="remixMeteorFill" />
  }
}
