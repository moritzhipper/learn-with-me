@if (label(); as label) {
  <p class="label size-0">{{ label }}</p>
}

<div class="values">
  @for (option of config(); track option) {
    <label>
      <input
        [disabled]="isDisabled()"
        type="radio"
        [checked]="option.value === value"
        (change)="setValue(option.value)"
        (blur)="onTouched()"
      />

      <span
        >{{ option.label || option.value }}
        @if (option.icon; as icon) {
          <ng-icon [svg]="icon" />
        }
      </span>
    </label>
  }
</div>
