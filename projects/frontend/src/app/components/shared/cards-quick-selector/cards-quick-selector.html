<button class="silent quick all caroussel-item">
  <h3>All Cards</h3>

  <div>{{ summary().allCardsCount }} Cards</div>
  <div>{{ summary().collectionCount }} Collections</div>
  <div>{{ summary().unsortedCount }} Cards without collection</div>
</button>
@for (coll of collections(); track coll.id) {
  <button class="silent quick collection caroussel-item">
    <h3>
      {{ coll.name }}
    </h3>
    <div>{{ coll.cardIds.length }} cards</div>
  </button>
}
