@for (sum of summaries(); track $index) {
  @if (sum.type === 'collection') {
    <button class="silent quick caroussel-item" (click)="openLink(sum.id)">
      <h3>
        {{ sum.name }}
      </h3>
      <liz-confidence-stats [confidence]="sum.averageConfidence" />

      <p class="size-0 bottom">{{ sum.createdAt | date: 'mediumDate' }}</p>
    </button>
  } @else {
    <button class="silent quick all caroussel-item" (click)="openLink()">
      <h3>All Cards</h3>
      <liz-confidence-stats [confidence]="sum.averageConfidence" />

      <p class="size-0 bottom">
        <span class="word-list-item">
          <strong> {{ sum.averageConfidence.all }}% </strong>
          confidence
        </span>
        @if (sum.collectionLess > 0) {
          <span class="word-list-item">
            <strong> {{ sum.collectionLess }} </strong> loose cards
          </span>
        }
      </p>
    </button>
  }
}
