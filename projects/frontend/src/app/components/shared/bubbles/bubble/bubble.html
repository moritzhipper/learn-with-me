<button
  class="silent bubble"
  (click)="select.emit()"
  [class]="size()"
  [class.trash]="config() === 'trash'"
>
  @switch (config()) {
    @case ('magic') {
      <app-icon-comp type="magic" />
    }
    @case ('bulk-edit') {
      <app-icon-comp type="pen" />
    }
    @case ('translate') {
      <app-icon-comp type="translate" />
    }
    @case ('remove') {
      <app-icon-comp type="collection-remove" />
    }
    @case ('import') {
      <app-icon-comp type="import" />
    }
    @case ('move') {
      <app-icon-comp type="collection-add" />
    }
    @case ('trash') {
      <app-icon-comp type="trash" />
    }
    @case ('checkbox-multiple-blank-line') {
      <app-icon-comp type="checkbox-multiple-blank-line" />
    }
    @case ('checkbox-multiple') {
      <app-icon-comp type="checkbox-multiple" />
    }
  }
  @if (count(); as c) {
    <div class="count text body size-0 bold" animate.enter="pop-in" animate.leave="pop-out">
      {{ c }}
    </div>
  }
</button>
