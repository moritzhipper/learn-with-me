<button
  class="silent bubble"
  (click)="select.emit()"
  [class]="size()"
  [class.trash]="config() === 'trash'"
>
  @switch (config()) {
    @case ('magic') {
      <ng-icon name="remixMagicFill" />
    }
    @case ('bulk-edit') {
      <ng-icon name="remixPencilFill" />
    }
    @case ('translate') {
      <ng-icon name="remixTranslate" />
    }
    @case ('remove') {
      <ng-icon name="remixFolderReduceLine" />
    }
    @case ('move') {
      <ng-icon name="remixFolderAddLine" />
    }
    @case ('trash') {
      <ng-icon name="remixDeleteBin5Line" />
    }

    @case ('checkbox-multiple') {
      <ng-icon name="remixCheckboxMultipleLine" />
    }
  }
  @if (count(); as c) {
    <div class="count text body size-0" animate.enter="pop-in" animate.leave="pop-out">
      {{ c }}
    </div>
  }
</button>
