<button
  class="silent bubble"
  (click)="select.emit()"
  [class]="size()"
  [class.trash]="config() === 'trash'"
>
  @switch (config()) {
    @case ('magic') {
      <ng-icon [svg]="icons.magicIcon" />
    }
    @case ('bulk-edit') {
      <ng-icon [svg]="icons.editIcon" />
    }
    @case ('translate') {
      <ng-icon [svg]="icons.translatePageIcon" />
    }
    @case ('remove') {
      <ng-icon [svg]="icons.removeFromCollectionIcon" />
    }
    @case ('move') {
      <ng-icon [svg]="icons.addToCollectionIcon" />
    }
    @case ('trash') {
      <ng-icon [svg]="icons.trashIcon" />
    }

    @case ('checkbox-multiple') {
      <ng-icon [svg]="icons.multiSelectIcon" />
    }
  }
  @if (count(); as c) {
    <div class="count text body size-0" animate.enter="pop-in" animate.leave="pop-out">
      {{ c }}
    </div>
  }
</button>
