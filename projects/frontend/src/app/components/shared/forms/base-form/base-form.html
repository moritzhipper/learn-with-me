<ng-container lizAnimDelayWrapper applyClass="fly-in-y">
  <div class="header-section">
    <h2 #animItem>{{ header() }}</h2>
    <div class="description" #animItem>
      <ng-content select="[form-description]" />
    </div>
  </div>

  <div class="content" #animItem>
    <ng-content select="[form-content]" />
  </div>

  <div class="buttons">
    <button class="big" type="button" #animItem (click)="cancel.emit()">{{ cancelLabel() }}</button>
    <button class="big" type="submit" #animItem>{{ confirmLabel() }}</button>
  </div>
</ng-container>
