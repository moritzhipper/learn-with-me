<form
  [formGroup]="form"
  (ngSubmit)="confirm(form.value)"
  liz-base-form
  (cancel)="cancel()"
  header="Edit card"
  confirmLabel="Save"
>
  <div class="fake-card full">
    <app-radio-comp
      formControlName="type"
      [config]="[{ value: 'word' }, { value: 'phrase' }]"
      label="type"
    />
    <input type="text" formControlName="lexeme" class="lexeme" />
    <input type="text" formControlName="translation" class="translation" />
    <input formControlName="notes" class="notes full" placeholder="( notes )" />
  </div>
</form>
