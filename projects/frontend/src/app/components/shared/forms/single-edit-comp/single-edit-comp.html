<form
  [formGroup]="form"
  (ngSubmit)="confirm(form.value)"
  liz-base-form
  (cancel)="cancel()"
  header="Edit card"
  confirmLabel="Save"
>
  <app-radio-comp
    formControlName="type"
    label="Type"
    [config]="[
      { label: 'Word', value: 'word' },
      { label: 'Phrase', value: 'phrase' }
    ]"
  />
  <div class="fake-card">
    <textarea type="text" formControlName="lexeme" class="lexeme text size-2"></textarea>
    <textarea type="text" formControlName="translation" class="translation text size-2"></textarea>
    <textarea formControlName="notes" class="notes text light" placeholder="Notes"></textarea>
  </div>
</form>
