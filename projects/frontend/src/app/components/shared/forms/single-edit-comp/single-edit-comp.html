<form
  [formGroup]="form"
  (ngSubmit)="confirm(form.value)"
  liz-base-form
  (cancel)="cancel()"
  header="Edit card"
  confirmLabel="Save"
>
  <div class="fake-card">
    <textarea type="text" formControlName="lexeme" class="lexeme"></textarea>
    <textarea type="text" formControlName="translation" class="translation"></textarea>
    <textarea formControlName="notes" class="notes full" placeholder="Notes"></textarea>
  </div>
  <app-radio-comp
    formControlName="type"
    darkMode
    label="Type"
    [config]="[
      { label: 'Word', value: 'word' },
      { label: 'Phrase', value: 'phrase' }
    ]"
  />
</form>
