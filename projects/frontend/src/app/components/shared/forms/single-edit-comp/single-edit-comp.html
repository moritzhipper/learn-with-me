<form
  [formGroup]="form"
  (ngSubmit)="confirm(form.value)"
  class="modal"
  lizAnimDelayWrapper
  applyClass="fly-in-y"
>
  <h2 #animItem>edit card</h2>
  <div class="fake-card full" #animItem>
    <app-radio-comp
      formControlName="type"
      [config]="[{ value: 'word' }, { value: 'phrase' }]"
      label="type"
    />
    <input type="text" formControlName="lexeme" class="lexeme" />
    <input type="text" formControlName="translation" class="translation" />
    <input formControlName="notes" class="notes full" placeholder="( notes )" />
  </div>

  <button type="button" class="big" #animItem (click)="cancel()">Cancel</button>
  <button type="submit" #animItem [disabled]="form.invalid">Save</button>
</form>
