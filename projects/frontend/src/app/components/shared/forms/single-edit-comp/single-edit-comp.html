<form [formGroup]="form" (ngSubmit)="confirm(form.value)" class="modal">
  <h2 class="fly-in-y-0">edit card</h2>
  <div class="fake-card full fly-in-y-0">
    <app-radio-comp
      formControlName="type"
      [config]="[{ value: 'word' }, { value: 'phrase' }]"
      label="type"
    />
    <input type="text" formControlName="lexeme" class="lexeme" />
    <input type="text" formControlName="translation" class="translation" />
    <input formControlName="notes" class="notes full" placeholder="( notes )" />
  </div>

  <button type="button" class="big fly-in-y-1" (click)="cancel()">Cancel</button>
  <button type="submit" class="fly-in-y-2" [disabled]="form.invalid">Save</button>
</form>
