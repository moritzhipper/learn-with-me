@let animSize = 6;

<form (ngSubmit)="confirm(form.value)" class="modal" [formGroup]="form">
  <div class="header full fly-in-y">
    <h2 [animDelay]="{ i: 0, size: animSize }">Import {{ bank().name }}</h2>

    <div class="description">
      @if (bank().collections.length > 1) {
        <span class="word-list-item"> {{ bank().collections.length }} collections</span>
      }
      <span class="word-list-item"> {{ bank().learnables.length }} cards</span>
    </div>
  </div>
  <p class="full">
    show here which language will be mapped on wich when languages divert. be specific about
    learning and speaking
  </p>
  <app-radio-comp
    class="full"
    formControlName="strategy"
    label="Import Strategy"
    darkMode
    [config]="[
      { value: 'merge', label: 'Merge' },
      { value: 'new', label: 'Add new Bank' }
    ]"
  />

  <app-radio-comp
    class="fly-in-y full"
    [animDelay]="{ i: 4, size: animSize }"
    formControlName="invertLanguageDirection"
    darkMode
    label="Switch direction?"
    [config]="[
      { value: false, label: 'Keep' },
      { value: true, label: 'Invert' }
    ]"
  />

  <button
    type="button"
    class="big fly-in-y"
    [animDelay]="{
      i: 5,
      size: animSize
    }"
    (click)="cancel()"
  >
    Cancel
  </button>
  <button
    type="submit"
    class="fly-in-y"
    [animDelay]="{
      i: 6,
      size: animSize
    }"
  >
    Import
  </button>
</form>
