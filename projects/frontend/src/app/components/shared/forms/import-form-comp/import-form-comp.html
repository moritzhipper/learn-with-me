<form (ngSubmit)="confirm(this.bank())" class="modal" [formGroup]="form">
  <h2 class="full fly-in-y-0">Import {{ bank().name }}?</h2>
  @if (bank().collections.length > 0) {
    <div class="preview full fly-in-y-0">
      <h3>Collections</h3>

      @for (coll of bank().collections; track coll.id) {
        <span class="word-list-item">
          {{ coll.name }}
        </span>
      }
    </div>
  }
  <div class="preview full fly-in-y-0">
    <h3>Cards</h3>
    @for (learnable of bank().learnables; track learnable) {
      <span class="word-list-item">{{ learnable.translation }}</span>
    }
  </div>
  <button type="button" class="big fly-in-y-1" (click)="cancel()">Cancel</button>
  <button type="submit" class="fly-in-y-2">Import</button>
</form>
