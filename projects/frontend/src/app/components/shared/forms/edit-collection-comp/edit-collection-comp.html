<form [formGroup]="form" (ngSubmit)="confirm(form.value.name)" class="modal">
  <h2 class="fly-in-y-0">edit collection</h2>
  <label class="fly-in-y-0">
    <span> name </span>
    <input type="text" formControlName="name" />
  </label>

  <button type="button" class="big fly-in-y-1" (click)="cancel()">Cancel</button>
  <button type="submit" class="fly-in-y-2" [disabled]="form.invalid">Save</button>
</form>
