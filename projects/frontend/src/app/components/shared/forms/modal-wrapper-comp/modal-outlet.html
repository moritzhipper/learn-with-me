@if (currentModalConfig(); as modalConf) {
  <div class="wrapper" animate.leave="fly-out-y">
    <div class="fake-dialog">
      <ng-container
        [ngComponentOutlet]="modalConf.component"
        [ngComponentOutletInputs]="modalConf.inputs"
      />
    </div>
  </div>
  <div class="backdrop" animate.enter="enter" animate.leave="leave"></div>
}
