<form
  [formGroup]="form"
  (ngSubmit)="confirm(form.value)"
  class="modal"
  lizAnimDelayWrapper
  applyClass="fly-in-y"
>
  <h2 delayItem>Delete collection?</h2>

  <app-radio-comp
    delayItem
    formControlName="deletionType"
    [config]="[
      { value: 'dissolve', label: 'Keep cards' },
      { value: 'remove', label: 'Remove cards' }
    ]"
  />

  <button type="button" delayItem (click)="cancel()">Cancel</button>
  <button type="submit" delayItem>Confirm</button>
</form>
