<form
  [formGroup]="form"
  (ngSubmit)="confirm(form.value)"
  class="modal"
  lizAnimDelayWrapper
  applyClass="fly-in-y"
>
  <h2 animItem>Delete collection?</h2>

  <app-radio-comp
    animItem
    formControlName="deletionType"
    [config]="[
      { value: 'dissolve', label: 'Keep cards' },
      { value: 'remove', label: 'Remove cards' }
    ]"
  />

  <button type="button" animItem (click)="cancel()">Cancel</button>
  <button type="submit" animItem>Confirm</button>
</form>
