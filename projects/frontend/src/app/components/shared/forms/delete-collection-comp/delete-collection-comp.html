<form
  [formGroup]="form"
  (ngSubmit)="confirm(form.value)"
  liz-base-form
  (cancel)="cancel()"
  header="Delete collection?"
>
  <app-radio-comp
    formControlName="deletionType"
    darkMode
    [config]="[
      { value: 'dissolve', label: 'Keep cards' },
      { value: 'remove', label: 'Remove cards' }
    ]"
  />
</form>
