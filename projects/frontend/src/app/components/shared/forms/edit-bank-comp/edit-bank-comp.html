<form
  (ngSubmit)="submit()"
  [formGroup]="form"
  liz-base-form
  (cancel)="cancel()"
  [header]="preset() ? 'Edit Bank' : 'Create new Bank'"
>
  <label>
    <span>Bank Name </span>
    <input formControlName="name" />
  </label>
  <label>
    <span> Speaking Language </span>
    <input formControlName="speaking" />
  </label>
  <label>
    <span> Learning Language </span>
    <input formControlName="learning" />
  </label>
</form>
