<form
  (ngSubmit)="confirm(form.value)"
  [formGroup]="form"
  liz-base-form
  (cancel)="cancel()"
  [header]="'Share ' + title() + '?'"
  confirmLabel="Share"
>
  <app-radio-comp
    label="Time online"
    formControlName="ttlMinutes"
    [config]="[
      {
        value: 5,
        label: '5 min'
      },
      {
        value: 1440,
        label: '1 day'
      },
      {
        value: 10080,
        label: '1 week'
      },
      {
        value: null,
        label: 'forever'
      }
    ]"
  />
  <app-radio-comp
    label="Make community bank"
    formControlName="isCommunityBank"
    [config]="[
      {
        value: true,
        label: 'Yes'
      },
      {
        value: false,
        label: 'No'
      }
    ]"
  />
</form>
