<form
  class="modal"
  (ngSubmit)="confirm(form.value)"
  [formGroup]="form"
  lizAnimDelayWrapper
  applyClass="fly-in-y"
>
  <h2 class="full" animItem>Share {{ title() }}?</h2>

  <app-radio-comp
    class="full"
    animItem
    label="Time online"
    formControlName="ttlMinutes"
    [config]="[
      {
        value: 5,
        label: '5 min'
      },
      {
        value: 1440,
        label: '1 day'
      },
      {
        value: 10080,
        label: '1 week'
      },
      {
        value: null,
        label: 'forever'
      }
    ]"
  />
  <app-radio-comp
    class="full"
    animItem
    label="Make community bank"
    formControlName="isCommunityBank"
    [config]="[
      {
        value: true,
        label: 'Yes'
      },
      {
        value: false,
        label: 'No'
      }
    ]"
  />
  <button type="button" (click)="cancel()" class="big" animItem>
    Cancel
  </button>
  <button type="submit" animItem>Share</button>
</form>
