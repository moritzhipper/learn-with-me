<form class="modal" (ngSubmit)="confirm()" [formGroup]="form">
  <div class="content fly-in-y-0">
    @if (message(); as message) {
      <h2>
        {{ message }}
      </h2>
    } @else {
      <ng-content />
    }
  </div>

  <button type="button" (click)="cancel()" class="big fly-in-y-1">Cancel</button>
  <button type="submit" class="fly-in-y-2">
    {{ label() }}
  </button>
</form>
