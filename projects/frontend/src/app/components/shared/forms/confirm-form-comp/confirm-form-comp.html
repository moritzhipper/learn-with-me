<form class="modal" (ngSubmit)="confirm()" [formGroup]="form">
  <div class="content fly-in-y" [animDelay]="{ i: 0, size: 3 }">
    @if (message(); as message) {
      <h2>
        {{ message }}
      </h2>
    }
    @if (description(); as description) {
      <p class="light pt-3">
        {{ description }}
      </p>
    }
  </div>

  <button type="button" (click)="cancel()" class="big fly-in-y" [animDelay]="{ i: 1, size: 3 }">
    Cancel
  </button>
  <button type="submit" class="fly-in-y" [animDelay]="{ i: 2, size: 3 }">
    {{ label() }}
  </button>
</form>
