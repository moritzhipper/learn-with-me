<form
  [formGroup]="form"
  (ngSubmit)="confirm(form.value)"
  class="modal"
  lizAnimDelayWrapper
  applyClass="fly-in-y"
>
  <div class="header full">
    <h2 animItem>Add to collection</h2>
    <p class="light pt-3" animItem>{{ cardIds().length }} cards selected</p>
  </div>

  <div class="collections" animItem>
    @for (collectionVM of collectionsVM(); track collectionVM.id) {
      <label class="radio">
        <input type="radio" [value]="collectionVM.id" formControlName="addToId" />

        <div class="display-text">
          <p>
            {{ collectionVM.name }}
          </p>
          <p class="count">
            adds
            {{ collectionVM.cardsWillBeAddedCount }}
          </p>
        </div>
      </label>
    }
  </div>
  <label animItem>
    <span>Create new</span>
    <input
      type="text"
      class="create"
      formControlName="createName"
      [class.selected]="form.value.createName && !form.value.addToId"
      (input)="resetCollectionSelection()"
      (click)="resetCollectionSelection()"
    />
  </label>
  <button class="big" animItem type="button" (click)="cancel()">Cancel</button>
  <button type="submit" [disabled]="!form.value.createName && !form.value.addToId" animItem>
    Confirm
  </button>
</form>
