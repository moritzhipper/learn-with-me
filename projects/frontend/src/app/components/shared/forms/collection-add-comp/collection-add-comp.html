<form [formGroup]="form" (ngSubmit)="confirm(form.value)" class="modal">
  <div class="header full">
    <h2 class="fly-in-y" [animDelay]="{ i: 0, size: 5 }">Add to collection</h2>
    <p class="fly-in-y light pt-3" [animDelay]="{ i: 0, size: 5 }">
      {{ cardIds().length }} cards selected
    </p>
  </div>

  <div class="collections fly-in-y" [animDelay]="{ i: 1, size: 5 }">
    @for (collectionVM of collectionsVM(); track collectionVM.id) {
      <label class="radio">
        <input type="radio" [value]="collectionVM.id" formControlName="addToId" />

        <div class="display-text">
          <p>
            {{ collectionVM.name }}
          </p>
          <p class="count">
            adds
            {{ collectionVM.cardsWillBeAddedCount }}
          </p>
        </div>
      </label>
    }
  </div>
  <label class="fly-in-y" [animDelay]="{ i: 2, size: 5 }">
    <span>Create new</span>
    <input
      type="text"
      class="create"
      formControlName="createName"
      [class.selected]="form.value.createName && !form.value.addToId"
      (input)="resetCollectionSelection()"
      (click)="resetCollectionSelection()"
    />
  </label>
  <button class="big fly-in-y" [animDelay]="{ i: 3, size: 5 }" type="button" (click)="cancel()">
    Cancel
  </button>
  <button
    type="submit"
    [disabled]="!form.value.createName && !form.value.addToId"
    class="fly-in-y"
    [animDelay]="{ i: 4, size: 5 }"
  >
    Confirm
  </button>
</form>
