<form
  (ngSubmit)="confirm(form.value.text)"
  [formGroup]="form"
  liz-base-form
  (cancel)="cancel()"
  header="Tone"
>
  <p form-description>
    Set a single word or a short description of the tone or context you want to use the translations
    in.
  </p>
  <textarea
    formControlName="text"
    placeholder="Casual, Formal, Adressing an arch enemy, etc."
  ></textarea>
</form>
