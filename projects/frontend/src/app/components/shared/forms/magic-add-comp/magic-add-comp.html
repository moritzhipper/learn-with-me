<form [formGroup]="convertForm" (ngSubmit)="convert()" class="modal">
  <div class="content fly-in-y-0">
    <textarea
      [class.converting]="isConverting()"
      formControlName="input"
      placeholder="paste notes, articles or any other text here"
    ></textarea>
    <app-radio-comp
      [config]="[{ value: 'words' }, { value: 'phrases' }, { value: 'both' }]"
      formControlName="type"
      label="types"
    />
  </div>
  <button class="big cancel fly-in-y-1" type="button" (click)="cancel()">Cancel</button>
  <button type="submit" class="icon fly-in-y-2" [disabled]="!convertForm.valid || isConverting()">
    @if (isConverting()) {
      <span>Converting...</span>
    } @else {
      <span>Convert</span>
    }
    <app-icon-comp type="magic" />
  </button>
</form>
