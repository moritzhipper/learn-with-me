<form
  [formGroup]="form"
  (ngSubmit)="confirm(form.value)"
  class="modal"
  lizAnimDelayWrapper
  applyClass="fly-in-y"
>
  <h2 class="full" animItem>Export Bank</h2>

  <liz-info-card title="Include history?" class="full" animItem>
    <p>You can include your practice history, translation history and stats in the export.</p>
    <app-radio-comp
      class="pt-3"
      animItem
      [config]="[
        { value: false, label: 'Exclude' },
        { value: true, label: 'Include' }
      ]"
      formControlName="includeUserData"
    />
  </liz-info-card>

  <button class="big secondary" type="button" (click)="cancel()" animItem>Cancel</button>
  <button class="big" type="submit" animItem>Export</button>
</form>
