<form class="modal" (ngSubmit)="confirm(form.value)" [formGroup]="form">
  <h2 class="fly-in-y-0">Start new Practice</h2>
  @if (hasActicePractice()) {
    <div class="warning full">
      <h3><strong>Practice already in progress </strong></h3>
      <p>Starting this practice will discard your current progress.</p>
    </div>
  }
  <app-radio-comp
    class="full fly-in-y-0"
    label="Direction"
    formControlName="direction"
    [config]="[
      { label: 'Forward', value: 'forward' },
      { label: 'Reverse', value: 'reverse' }
    ]"
  />

  <button type="button" (click)="cancel()" class="big fly-in-y-1">Cancel</button>
  <button type="submit" class="fly-in-y-2">
    @if (hasActicePractice()) {
      Start new
    } @else {
      Start
    }
  </button>
</form>
