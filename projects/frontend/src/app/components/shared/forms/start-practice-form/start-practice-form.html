@let conf = config();

<form
  liz-base-form
  (ngSubmit)="confirm(form.value)"
  [formGroup]="form"
  (cancel)="cancel()"
  header="Start new Practice"
>
  @if (conf.confidence; as confidence) {
    <liz-confidence-stats form-description [confidence]="confidence" />
  }

  @if (conf.hasActivePractice) {
    <liz-info-card class="mb-4" type="warn" title="Practice already in progress">
      <p>Starting a new one will end your current run.</p>
    </liz-info-card>
  }
  @if (conf.confidence; as confidence) {
    <liz-confidence-dots [confidence]="conf.confidence" />
  }

  <app-radio-comp
    label="Guess"
    formControlName="guessableField"
    [config]="[
      { value: 'translation', label: conf.languageConfig.speaking, icon: understandIcon },
      { value: 'lexeme', label: conf.languageConfig.learning, icon: speakingIcon }
    ]"
  />
</form>
