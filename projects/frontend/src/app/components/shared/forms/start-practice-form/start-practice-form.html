<form class="modal" (ngSubmit)="confirm(form.value)" [formGroup]="form">
  <h2 class="fly-in-y" [animDelay]="{ i: 0, size: 5 }">Start new Practice</h2>
  @if (hasActivePractice()) {
    <liz-info-card
      class="fly-in-y full"
      [animDelay]="{ i: 1, size: 5 }"
      type="warn"
      title="Practice already in progress"
    >
      <p>Starting a new practice will discard your current progress.</p>
    </liz-info-card>
  }
  <app-radio-comp
    class="full fly-in-y"
    [animDelay]="{ i: 2, size: 5 }"
    label="Direction"
    formControlName="direction"
    [config]="[
      { label: 'Forward', value: 'guessTranslation' },
      { label: 'Reverse', value: 'guessLexeme' }
    ]"
  />

  <button type="button" (click)="cancel()" class="big fly-in-y" [animDelay]="{ i: 3, size: 5 }">
    Cancel
  </button>
  <button type="submit" class="fly-in-y" [animDelay]="{ i: 4, size: 5 }">Start new</button>
</form>
