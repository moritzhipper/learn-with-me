<div class="bg-wrapper">
  <div class="card-bg one"></div>
  <div class="card-bg two"></div>
</div>
@let coll = collection();
<app-header-link [route]="'/cards'" label="Cards" eyebrow class="pb-3" />

<h1 class="pb-3">
  {{ coll.name }}
</h1>
<liz-confidence-stats [confidence]="confidence()" class="pb-2 text size-2" />
<p class="light">{{ coll.createdAt | date: 'mediumDate' }}</p>

<app-practice-rating-comp [confidence]="confidence().all" />
