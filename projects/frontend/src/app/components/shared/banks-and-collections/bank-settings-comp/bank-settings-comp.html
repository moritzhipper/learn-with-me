@let b = bank();

<div class="name">
  {{ b.name }}
</div>

<button class="silent share" (click)="share.emit()">
  <ng-icon [svg]="shareIcon" />
</button>
<div class="details">
  <liz-language-match [languageConfig]="b.language" />
  <p class="size-0">
    <span class="word-list-item"> {{ b.collections.length }} collections </span>
    <span class="word-list-item"> {{ b.learnables.length }} learnables </span>
  </p>
  <p class="size-0">{{ b.createdAt | date: 'mediumDate' }}</p>
</div>

<button class="small delete" (click)="delete.emit()">Delete</button>
<button class="small download" (click)="download.emit()">Download</button>
<button class="small edit" (click)="edit.emit()">Edit</button>
<button class="small activate" [class.active]="isActive()" (click)="setActive.emit()">
  @if (isActive()) {
    This Bank is active
  } @else {
    Set as active
  }
</button>
