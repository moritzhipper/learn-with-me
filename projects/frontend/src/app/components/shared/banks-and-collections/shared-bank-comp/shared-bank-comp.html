<h3>
  {{ bank().name }}
</h3>
<p class="light ml-auto">{{ ttl() }}</p>

<liz-shared-bank-stats [bank]="bank()" class="info" hideCounts />
<liz-language-match [languageConfig]="bank().language" class="info" />

<p class="shared size-0 mt-auto">{{ bank().createdAt | date: 'mediumDate' }}</p>
<p class="size-0 light ml-auto">
  {{ bank().downloads }} {{ bank().downloads === 1 ? 'download' : 'downloads' }}
</p>
