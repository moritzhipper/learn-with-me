@let ba = bank();
<p>
  <span class="word-list-item"> {{ ba.collections.length }} collections </span>
  <span class="word-list-item"> {{ counts().words }} words </span>
  <span class="word-list-item"> {{ counts().phrases }} phrases </span>
</p>
<p>
  <span class="word-list-item"> expires {{ ba.expires }} </span>
  <span class="word-list-item"> added {{ ba.createdAt | date: 'mediumDate' }} </span>
  <span class="word-list-item"> {{ ba.downloads }} downloads </span>
</p>
