<form [formGroup]="form" (ngSubmit)="start()" liz-swiper-page-layout>
  <div swiper-top>
    <div class="counter">
      <p class="count">
        {{ selectedLearnables().length }}
      </p>
      <p class="label size-3 light pt-0">Cards in set</p>
    </div>
    <liz-confidence-dots [confidence]="confidence()" />

    <app-radio-comp
      [config]="[
        { label: 'All', value: null },
        { value: 'word', label: 'Word' },
        { value: 'phrase', label: 'Phrase' }
      ]"
      formControlName="type"
      label="Type"
    />
    <app-radio-comp
      [config]="[
        { value: null, label: 'All' },
        { value: 'low', label: 'Low' },
        { value: 'medium', label: 'Medium' }
      ]"
      formControlName="confidence"
      label="Confidence"
    />
    <app-radio-comp
      [config]="[
        { value: 'translation', label: bank().language.speaking, icon: icons.learnLanguageIcon },
        { value: 'lexeme', label: bank().language.learning, icon: icons.speakLanguageIcon }
      ]"
      label="Guess"
      formControlName="guessableField"
      class="full"
    />
    <label class="full">
      <span> Collection </span>
      <select formControlName="collectionIdentifier" class="dark">
        @for (option of selectOptions(); track option) {
          <option [ngValue]="option.id">
            {{ option.label }}
            ({{ option.confidence }}%)
          </option>
        }
      </select>
    </label>
  </div>

  <button
    type="submit"
    class="wide"
    [disabled]="selectedLearnables().length === 0"
    swiper-navigation
  >
    Start Practice
  </button>
</form>
