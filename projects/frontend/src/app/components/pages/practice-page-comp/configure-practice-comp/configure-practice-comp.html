<div class="counter">
  <span class="count">
    {{ selectedLearnableIds().length }}
  </span>
  <span class="label">Cards in Set</span>
</div>

<form [formGroup]="form" (ngSubmit)="start()">
  <app-radio-comp
    [config]="[
      { label: 'All', value: null },
      { value: 'word', label: 'Word' },
      { value: 'phrase', label: 'Phrase' }
    ]"
    formControlName="type"
    label="Type"
  />
  <app-radio-comp
    [config]="[
      { value: null, label: 'All' },
      { value: 'low', label: 'Low' },
      { value: 'medium', label: 'Medium' }
    ]"
    formControlName="confidence"
    label="Confidence"
  />
  <app-radio-comp
    [config]="[
      { value: 'forward', label: bank().language.speaking },
      { value: 'reverse', label: bank().language.learning }
    ]"
    label="Guess Language"
    formControlName="direction"
  />
  <label class="collection">
    <span> Collection </span>
    <select formControlName="collectionIdentifier">
      @for (option of selectOptions(); track option) {
        <option [ngValue]="option.id">
          {{ option.label }}
          ({{ option.confidence }}%)
        </option>
      }
    </select>
  </label>
  <button type="submit" class="icon" [disabled]="selectedLearnableIds().length === 0">
    Start Practice
  </button>
</form>
