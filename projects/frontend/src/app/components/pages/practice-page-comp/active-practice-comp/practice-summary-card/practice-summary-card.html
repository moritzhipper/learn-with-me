@let sum = summary();

<div class="wrapper">
  <app-practice-rating-comp [rating]="sum.rating" />

  <div class="stats">
    <h2>You got {{ sum.guessedRightPercent }}% right</h2>
    <p class="subtitle">{{ text() }}</p>
    <div class="stat">
      <p class="label size-0">guessed incorrectly</p>
      <span class="count">{{ sum.wrongGuesses }}</span>
    </div>
    <div class="stat">
      <p class="label size-0">guessed correctly</p>
      <span class="count">{{ sum.correctGuesses }}</span>
    </div>
    <div class="stat">
      <p class="label size-0">unanswered</p>
      <span class="count">{{ sum.unansweredGuesses }}</span>
    </div>
  </div>
</div>
<app-larry-big />
