@if (vm(); as vm) {
  @for (cardVM of vm.cardVMs; track cardVM.card.id) {
    <div
      class="card"
      [attr.card-index]="cardVM.index"
      [attr.card-state]="cardVM.state"
      [style.--x.px]="cardVM.position.x"
      [style.--y.px]="cardVM.position.y"
      [style.--rotate.deg]="cardVM.position.rotate"
    >
      <p class="bold size-3">
        {{ cardVM.card.lexeme }}
      </p>
      <p class="italic size-3">
        {{ cardVM.card.translation }}
      </p>
    </div>
  }

  <ng-icon [svg]="icons.incorrectAnswerIcon" class="vote wrong" />
  <ng-icon [svg]="icons.correctAnswerIcon" class="vote right" />
  @if (guessState() === 'done') {
    <ng-container lizAnimDelayWrapper [duration]="1" applyClass="pop-in">
      <liz-swiper-summary #animItem />

      <!-- show 'continue to improve this rating, only x unanswered and y wrong left!' -->
      <div class="nav finalize">
        <button class="big" (click)="finish()" #animItem>Finish</button>
        <button class="big primary has-icon" #animItem>
          Continue <ng-icon [svg]="icons.practiceSpeedIcon" />
        </button>
      </div>
    </ng-container>
  } @else {
    <div class="debug">
      <div>{{ guessState() }} | {{ castedGuess() }}</div>
      <div>{{ hostDimension()?.height }}</div>
      <div class="flex">
        <button (click)="finish()">finish</button>
        <button (click)="giveUp()">give up</button>
      </div>
    </div>
  }
}
