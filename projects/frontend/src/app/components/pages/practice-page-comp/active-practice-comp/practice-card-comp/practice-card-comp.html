@let dir = reverseDirection();
@let card = learnable();
<div class="wrapper">
  <div class="top">{{ dir ? card.translation : card.lexeme }}</div>
  <div class="bottom">{{ dir ? card.lexeme : card.translation }}</div>
  <textarea
    class="notes"
    placeholder="no notes"
    [value]="card.notes"
    (input)="setUpdatedNotes(textArea.value)"
    (blur)="finishEditing.emit()"
    [disabled]="!allowEdit()"
    #textArea
  ></textarea>
</div>
