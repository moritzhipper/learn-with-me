@let forward = direction() === 'forward';
@let card = learnable();
<div class="wrapper">
  <div class="top">{{ forward ? card.lexeme : card.translation }}</div>
  <div class="bottom">{{ forward ? card.translation : card.lexeme }}</div>
  <textarea
    class="notes"
    placeholder="no notes"
    [value]="card.notes"
    (input)="setUpdatedNotes(textArea.value)"
    [disabled]="!allowEdit()"
    #textArea
  ></textarea>
</div>
