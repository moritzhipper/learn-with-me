@let guessTranslation = guessableField() === 'translation';
@let card = learnable();
<div class="wrapper">
  <p class="top size-3">{{ guessTranslation ? card.lexeme : card.translation }}</p>
  <p class="bottom size-3">{{ guessTranslation ? card.translation : card.lexeme }}</p>
  <textarea
    class="notes"
    placeholder="no notes"
    [value]="card.notes"
    (input)="setUpdatedNotes(textArea.value)"
    [disabled]="!allowEdit()"
    #textArea
  ></textarea>
</div>
