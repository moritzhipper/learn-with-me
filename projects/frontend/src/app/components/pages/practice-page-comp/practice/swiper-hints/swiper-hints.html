<div class="content">
  <p class="label pb-2">
    <span class="size-2 bold"> Tap </span>
    <br />
    <span> to reveal </span>
  </p>

  <div class="hints pb-5">
    <ng-icon [svg]="icons.swipeHintIcon" class="swipe wrong" />
    <ng-icon [svg]="icons.swipeHintIcon" class="swipe right" />
    <ng-icon [svg]="icons.incorrectAnswerIcon" class="guess wrong" />
    <ng-icon [svg]="icons.correctAnswerIcon" class="guess right" />
  </div>

  <p class="label">
    <span class="size-2 bold"> Swipe right or left </span>
    <br />
    <span> to cast a guess </span>
  </p>
</div>
