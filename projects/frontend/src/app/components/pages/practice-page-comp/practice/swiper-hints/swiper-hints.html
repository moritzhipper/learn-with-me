@if (type() === 'tap') {
  <div class="hints pb-3">
    <ng-icon [svg]="icons.tapIcon" class="tap" />
  </div>
  <p class="label">
    <span class="size-2 bold">
      <span class="phone"> Tap </span>
      <span class="desktop"> Use up arrow </span>
    </span>
    <br />
    <span> to reveal </span>
  </p>
} @else {
  <div class="hints pb-5">
    <ng-icon [svg]="icons.swipeHintIcon" class="swipe wrong" />
    <ng-icon [svg]="icons.swipeHintIcon" class="swipe right" />
    <ng-icon [svg]="icons.incorrectAnswerIcon" class="guess wrong" />
    <ng-icon [svg]="icons.correctAnswerIcon" class="guess right" />
  </div>

  <p class="label">
    <span class="size-2 bold mobile">
      <span class="phone"> Swipe right or left</span>
      <span class="desktop"> Use right or left arrow </span>
    </span>
    <br />
    <span> to cast a guess </span>
  </p>
}
