@if (vm(); as vm) {
  @for (cardVM of vm.cardVMs; track cardVM.card.id) {
    <div class="card" [attr.guess]="cardVM.guess" [attr.offset-to-active]="cardVM.offsetToActive">
      @if (vm.guessableField === 'translation') {
        <p class="bold size-3">
          {{ cardVM.card.lexeme }}
        </p>
        <p class="italic size-3">
          {{ cardVM.card.translation }}
        </p>
      } @else {
        <p class="italic size-3">
          {{ cardVM.card.translation }}
        </p>
        <p class="size-2 light pt-4">
          {{ cardVM.card.lexeme }}
        </p>
      }
      <p class="size-2 light pt-4">
        {{ cardVM.card.notes }}
      </p>
    </div>
  }
  <div
    class="card larry"
    guess="unanswered"
    [attr.offset-to-active]="vm.guessableIndex - vm.cardVMs.length"
  >
    <app-larry-big />
  </div>

  <ng-icon [svg]="icons.incorrectAnswerIcon" class="vote wrong" />
  <ng-icon [svg]="icons.correctAnswerIcon" class="vote right" />
}
