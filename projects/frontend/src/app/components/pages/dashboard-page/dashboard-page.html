<app-page-wrapper icon="dashboard">
  <app-page-header-comp title="Home" />
  <div class="sections">
    <section class="quick-links full-width-scroll">
      <a class="quick-link translate" routerLink="/translate">
        Translate

        <app-icon-comp type="translate" />
      </a>
      <a class="quick-link translate" routerLink="/translate" [state]="{ mode: 'magic' }">
        Generate
        <app-icon-comp type="magic" />
      </a>
      <a class="quick-link stats" routerLink="/stats">
        Stats

        <app-icon-comp type="donut-chart-fill" />
      </a>
    </section>
    <section class="quick-actions">
      <app-header-link label="Practice" route="practice" />
      <div class="caroussel-wrapper">
        <app-practice-quick-actions />
      </div>
    </section>
    <section class="quick-actions">
      <app-header-link label="My Cards" route="cards" />
      <div class="caroussel-wrapper">
        <app-cards-quick-selector />
      </div>
    </section>
    <section class="quick-actions">
      <app-header-link label="Community Banks" route="community" />
      <div class="caroussel-wrapper">
        @if (sharedBanks.hasValue() && sharedBanks.value().length > 0) {
          @for (bank of sharedBanks.value(); track bank.id) {
            <app-shared-bank-comp class="caroussel-item" [bank]="bank" [isCommunityBank]="true" />
          }
        } @else {
          <p>Shared banks are not available right now. Try again later.</p>
        }
      </div>
    </section>
  </div>
</app-page-wrapper>
