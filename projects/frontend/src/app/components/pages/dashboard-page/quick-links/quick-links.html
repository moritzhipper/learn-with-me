@for (type of types(); track type) {
  @switch (type) {
    @case ('translate') {
      <a class="quick-link" routerLink="/translate" #translate>
        Translate
        <app-icon-comp type="translate" />
      </a>
    }
    @case ('generate') {
      <a class="quick-link" routerLink="/translate" [state]="{ mode: 'magic' }">
        Generate
        <app-icon-comp type="magic" />
      </a>
    }
    @case ('create') {
      <button class="silent quick-link" (click)="createCards()">
        Create
        <app-icon-comp type="pen" />
      </button>
    }
    @case ('community') {
      <a class="quick-link" routerLink="/community">
        Community
        <app-icon-comp type="share-network-fill" />
      </a>
    }
    @case ('stats') {
      <a class="quick-link stats" routerLink="/stats">
        Stats
        <app-icon-comp type="donut-chart-fill" />
      </a>
    }
  }
}
