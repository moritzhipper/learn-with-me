@for (type of types(); track type) {
  @switch (type) {
    @case ('translate') {
      <a class="quick-link" routerLink="/translate" #translate>
        Translate

        <ng-icon name="remixTranslate" />
      </a>
    }
    @case ('generate') {
      <a class="quick-link" routerLink="/translate" [state]="{ mode: 'magic' }">
        Generate
        <ng-icon name="remixMagicFill" />
      </a>
    }
    @case ('create') {
      <button class="silent quick-link" (click)="createCards()">
        Create
        <ng-icon name="remixPencilFill" />
      </button>
    }
    @case ('community') {
      <a class="quick-link" routerLink="/community">
        Community
        <ng-icon name="remixShareFill" />
      </a>
    }
    @case ('stats') {
      <a class="quick-link stats" routerLink="/stats">
        Stats
        <ng-icon name="remixDonutChartFill" />
      </a>
    }
  }
}
