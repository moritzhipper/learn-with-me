<app-page-icon-comp type="compass" />
<app-page-header-comp title="Explore" backLink="/community" />
<div class="banks">
  @for (bank of visibleBanks(); track bank.id) {
    <app-shared-bank-comp class="stacked-shadow" [bank]="bank" [isCommunityBank]="true" />
  }
</div>
@switch (fetchState()) {
  @case ('loading') {
    loading...
  }
  @case ('all-loaded') {
    all items loaded
  }
  @case ('error') {
    error loading items
    <button>retry</button>
  }
}
