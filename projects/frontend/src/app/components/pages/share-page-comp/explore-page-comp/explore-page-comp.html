<app-page-icon-comp type="compass" />
<app-page-header-comp title="Explore" backLink="/community" backLinkText="community">
  <h2 class="language">
    <div class="speaking ellipsis">{{ params().speaking ?? 'All languages' }}</div>
    <app-icon-comp class="icon arrows" type="left-right" [size]="20" />
    <div class="learning ellipsis">{{ params().learning ?? 'All languages' }}</div>
  </h2>
</app-page-header-comp>

<div class="params-config fly-in-y-wide">
  <button class="small change" (click)="changeLanguageMatch()">
    <span> change match </span>
    <app-icon-comp class="icon pen" type="pen" [size]="16" />
  </button>
  <app-radio-comp
    class="category"
    [config]="[{ value: 'popular' }, { value: 'new' }]"
    [darkMode]="true"
    [ngModel]="params().category"
    (ngModelChange)="updateCategory($event)"
  />
</div>

<div class="banks">
  @for (bankVM of visibleBanksVM(); track bankVM.item.id) {
    <app-shared-bank-comp
      class="stacked-shadow fly-in-y-wide"
      [bank]="bankVM.item"
      [isCommunityBank]="true"
      (copyId)="copyBankId(bankVM.item)"
      (importBank)="importBank(bankVM.item)"
      [style.animationDelay.s]="bankVM.animDelay"
    />
  }
</div>

<div class="state-indicator">
  @switch (fetchState()) {
    @case ('loading') {
      <app-loading-spinner />
    }
    @case ('all-loaded') {
      <p class="all-there">
        <strong> you looked at all of the banks</strong>
      </p>
    }
    @case ('error') {
      <p class="error">
        <strong> error loading items </strong>
      </p>
      <button class="big">retry</button>
    }
  }
</div>
