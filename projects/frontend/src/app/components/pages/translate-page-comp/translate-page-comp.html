<app-page-icon-comp type="translate" />

<app-bubbles>
  @if (selectedMode() === 'quick') {
    <app-bubble config="magic" size="big" (select)="toggleMode()" />
  } @else {
    <app-bubble config="translate" size="big" (select)="toggleMode()" />
  }

  <app-bubble config="move" />
  <app-bubble config="reset-selection" />
</app-bubbles>

<input
  [ngModel]="tone()"
  (ngModelChange)="setTone($event)"
  class="context"
  type="text"
  placeholder="Set tone or context..."
/>
@if (selectedMode() === 'quick') {
  <app-quick-translate (openInMagicMode)="openInMagicMode($event)" />
} @else {
  <app-magic-translate [preset]="magicPreset()" />
}
