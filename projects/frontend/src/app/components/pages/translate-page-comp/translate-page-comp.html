<app-page-icon-comp type="translate" />
<div class="translate">
  <textarea placeholder="type to translate" (input)="onInput($event)"></textarea>
  <p class="translation">
    @if (fastTranslation(); as translation) {
      {{ translation }}
    }
  </p>
</div>
<div class="proposal">
  @let cards = proposedCards();
  @for (card of cards; track card.item.lexeme) {
    <app-learnable-comp
      animate.enter="fly-in-y-wide"
      animate.leave="poof"
      [learnable]="card.item"
      [style.--anim-delay.s]="card.animDelay"
    />
  }
</div>
