<app-page-icon-comp type="translate" />

<input
  [ngModel]="tone()"
  (ngModelChange)="setTone($event)"
  class="context"
  type="text"
  placeholder="Set tone or context..."
/>
@if (selectedMode() === 'quick') {
  <app-quick-translate (openMagicMode)="openInMagicMode($event)" />
} @else {
  <app-magic-translate [preset]="magicPreset()" (openQuickMode)="openQuickMode()" />
}
