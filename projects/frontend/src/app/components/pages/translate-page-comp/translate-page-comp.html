<app-page-icon-comp type="translate" />
<div class="translate">
  <textarea placeholder="type to translate" (input)="onInput($event)"></textarea>
  <p class="translation">
    @if (translationCard(); as translation) {
      {{ translation.translation }}
    }
  </p>
</div>

@if (translationCard(); as learnable) {
  <div class="proposal">
    <app-learnable-comp class="fly-in-y-wide" [learnable]="learnable" />
  </div>
}
