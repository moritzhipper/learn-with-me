<app-bubbles>
  <app-bubble [config]="selectedMode()" size="big" (select)="toggleMode()" />
  <app-bubble config="checkbox-multiple" size="medium" (select)="selectAll()" />
  @if (selectedCardsIds().size) {
    <app-bubble config="reset-selection" [animateIndex]="1" (select)="resetSelection()" />
    <app-bubble config="move" [animateIndex]="2" (select)="importCards()" />

    @if (selectedMode() === 'translate') {
      <app-bubble config="trash" [animateIndex]="3" (select)="deleteSelection()" />
    }
  }
</app-bubbles>

<app-page-wrapper icon="translate">
  <div class="header" header>
    <button class="tone-wrapper silent" (click)="setTone()">
      <p class="label size-0">Tone <app-icon-comp type="pen" [size]="16" /></p>
      <p class="tone size-2 ellipsis">{{ tone() || 'Neutral' }}</p>
    </button>
    @if (selectedMode() === 'translate') {
      <app-quick-translate />
    } @else {
      <app-magic-translate [(preset)]="magicPreset" (newCardsCreated)="scrollToCards()" />
    }
  </div>

  <div class="cards-wrapper" #cardsWrapper>
    @if (selectedMode() === 'translate') {
      <h2 class="indent fly-in-y-wide">History</h2>
    } @else {
      <h2 class="indent first fly-in-y-wide">Extracted Cards</h2>
    }
    @let transCount = cards().length;
    <div class="cards">
      @for (card of cards(); track card.id) {
        <app-learnable-comp
          class="fly-in-y-wide"
          [animDelay]="{ i: $index + 1, size: transCount }"
          [learnable]="card"
          (onSelect)="toggleSelection(card.id)"
          [isSelected]="isSelected(card.id)"
        />
      }
    </div>
  </div>
</app-page-wrapper>
