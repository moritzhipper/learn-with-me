<app-page-icon-comp type="translate" />
<div
  class="translate"
  [style.--debounce-duration.s]="FAST_TRANSLATION_DEBOUNCE_MS / 1000"
  [class.show-translation]="lexemeInput() && translation()"
>
  <textarea
    #lexemeEl
    placeholder="type to translate"
    [(ngModel)]="lexemeInput"
    [class]="textSizeClass()"
  ></textarea>
  <p class="translation" #translationWrapperEl [class]="textSizeClass()">
    <span #translationEl>
      {{ translation() }}
    </span>
  </p>
</div>
<div class="proposal">
  @for (card of proposedCards(); track card.item) {
    <app-learnable-comp
      animate.enter="fly-in-y-wide"
      animate.leave="fly-out-y"
      [learnable]="card.item"
      [style.--anim-delay.s]="card.animDelay"
    />
  }
</div>
<div class="history-wrapper">
  @for (item of history(); track item.id) {
    <div class="history-item">
      <div class="lexeme">{{ item.lexeme }}</div>
      <div class="translation">{{ item.translation }}</div>
      <button class="silent" (click)="deleteHistoryItem(item.id)">
        <app-icon-comp type="trash" />
      </button>
    </div>
  }
</div>
