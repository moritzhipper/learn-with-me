<app-page-icon-comp type="translate" />
<button class="silent mode-switch-bubble" (click)="toggleMode()">
  @if (selectedMode() === 'quick') {
    <app-icon-comp type="magic" />
  } @else {
    <app-icon-comp type="translate" />
  }
</button>
<input
  [ngModel]="tone()"
  (ngModelChange)="setTone($event)"
  class="context"
  type="text"
  placeholder="Set tone or context..."
/>
@if (selectedMode() === 'quick') {
  <app-quick-translate (openInMagicMode)="openInMagicMode($event)" />
} @else {
  <app-magic-translate [preset]="magicPreset()" />
}
