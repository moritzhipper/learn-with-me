<app-page-icon-comp type="translate" />
<input
  [ngModel]="tone()"
  (ngModelChange)="setTone($event)"
  class="context"
  type="text"
  placeholder="Set tone or context..."
/>
<div
  class="translate"
  [style.--debounce-duration.s]="FAST_TRANSLATION_DEBOUNCE_MS / 1000"
  [class.show-translation]="lexemeInput() && translation()"
  [class.small-text]="showSmallText()"
>
  <textarea #lexemeEl placeholder="Type to translate" [(ngModel)]="lexemeInput"></textarea>
  <p class="translation" #translationWrapperEl>
    <span #translationEl>
      {{ translation() }}
    </span>
  </p>
</div>

<div class="history-wrapper">
  @for (item of history(); track item.id) {
    <div class="history-item">
      <div class="text">
        <div class="lexeme">{{ item.lexeme }}</div>
        <div class="translation">{{ item.translation }}</div>
        @if (item.tone) {
          <div class="tone">{{ item.tone }}</div>
        }
        <div class="tone"></div>
      </div>
      <div class="interaction">
        <button class="has-icon small">
          add
          <app-icon-comp type="add-fill" />
        </button>
        <button class="remove small" (click)="deleteHistoryItem(item.id)">
          <app-icon-comp type="trash" />
        </button>
      </div>
    </div>
  }
</div>
