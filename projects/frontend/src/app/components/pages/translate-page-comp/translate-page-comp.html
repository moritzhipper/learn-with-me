<app-page-icon-comp type="translate" />
<app-bubbles>
  <app-bubble [config]="selectedMode()" size="big" (select)="toggleMode()" />
  <app-bubble config="checkbox-multiple" size="medium" (select)="selectAll()" />
  @if (selectedCardsIds().size) {
    <app-bubble config="reset-selection" [animateIndex]="1" (select)="resetSelection()" />
    <app-bubble config="move" [animateIndex]="2" (select)="importCards()" />

    @if (selectedMode() === 'translate') {
      <app-bubble config="trash" [animateIndex]="3" (select)="deleteSelection()" />
    }
  }
</app-bubbles>

<input
  [ngModel]="translations().tone"
  (ngModelChange)="setTone($event)"
  class="context"
  type="text"
  placeholder="Set tone or context..."
/>
@if (selectedMode() === 'translate') {
  <app-quick-translate />
  <div class="cards">
    @for (card of translations().history; track card.id) {
      <app-learnable-comp
        [learnable]="card"
        (onSelect)="toggleSelection(card.id)"
        [isSelected]="isSelected(card.id)"
      />
    }
  </div>
} @else {
  <app-magic-translate [(preset)]="magicPreset" />
  <div class="cards">
    @for (card of translations().magicTranslateCards; track card.id) {
      <app-learnable-comp
        class="fly-in-y-wide"
        [animDelay]="{ i: $index, list: translations().magicTranslateCards }"
        [learnable]="card"
        (onSelect)="toggleSelection(card.id)"
        [isSelected]="isSelected(card.id)"
      />
    }
  </div>
}
