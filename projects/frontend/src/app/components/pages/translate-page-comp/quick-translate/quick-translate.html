<div
  class="translate"
  [style.--debounce-duration.s]="FAST_TRANSLATION_DEBOUNCE_MS / 1000"
  [class.show-translation]="lexemeInput() && translation()"
  [class.small-text]="showSmallText()"
>
  <textarea #lexemeEl placeholder="Type to translate" [(ngModel)]="lexemeInput"></textarea>

  <div class="separator">
    <div class="line"></div>
    <button class="switch silent" [disabled]="!translation()" (click)="toggleDirection()">
      <app-icon-comp type="left-right" class="icon" [class.rotated]="invertDirection()" />
    </button>
    <div class="line"></div>
  </div>

  <p class="translation" #translationWrapperEl>
    <span #translationEl>
      {{ translation() }}
    </span>
  </p>
</div>
