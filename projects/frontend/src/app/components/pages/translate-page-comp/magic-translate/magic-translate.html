<div class="header-section">
  <form [formGroup]="form">
    <textarea
      placeholder="Paste notes, articles, or any other text here"
      formControlName="text"
    ></textarea>
    <button class="big image" type="button">
      <app-icon-comp type="image" [size]="32" />
    </button>
    <app-radio-comp
      [config]="[
        { value: 'word', label: 'Words' },
        { value: 'phrase', label: 'Phrases' },
        { value: 'both', label: 'Both' }
      ]"
      formControlName="type"
      class="type"
    />
  </form>
</div>
