<div class="header-section">
  <form [formGroup]="form">
    <textarea
      placeholder="Paste notes, articles, or any other text here"
      formControlName="text"
    ></textarea>
    <div class="image-input">
      <input
        id="image"
        type="file"
        accept="image/*;capture=camera"
        (change)="onFileChange($event)"
      />
      <label for="image">
        <app-icon-comp type="image" [size]="32" />
      </label>
    </div>
    <app-radio-comp
      [config]="[
        { value: 'word', label: 'Words' },
        { value: 'phrase', label: 'Phrases' },
        { value: 'both', label: 'Both' }
      ]"
      formControlName="type"
      class="type"
    />
  </form>
</div>

<div class="proposal">
  @for (card of proposedCards(); track card) {
    <app-learnable-comp [learnable]="card" />
  }
</div>
