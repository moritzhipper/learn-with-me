<form [formGroup]="form" (ngSubmit)="translate()" [class.converting]="isConverting()">
  @if (formSignal().mode === 'extract') {
    @if (imagePreview(); as img) {
      <div class="image-preview">
        <img [src]="img" alt="Preview" />
        <button type="button" class="small image-delete has-icon" (click)="imagePreview.set(null)">
          Remove Image
        </button>
      </div>
    } @else {
      <textarea
        placeholder="Paste notes, articles, or any other text here and press Generate"
        formControlName="source"
      ></textarea>
      <div class="image-input">
        <input
          id="image"
          type="file"
          accept="image/*;capture=camera"
          (change)="onFileChange($event)"
        />
        <label for="image">
          <ng-icon [svg]="icons.imageExtractIcon" />
        </label>
      </div>
    }
  } @else {
    <textarea
      placeholder="Describe what you want to learn and press Generate. For example: 'Describing time management'"
      formControlName="source"
    ></textarea>
  }

  <div class="config">
    <app-radio-comp
      [darkMode]="true"
      [config]="[
        { value: 'extract', label: 'Extract' },
        { value: 'generate', label: 'Generate' }
      ]"
      formControlName="mode"
    />
    <app-radio-comp
      [darkMode]="true"
      [config]="[
        { value: 'word', label: 'Words' },
        { value: 'phrase', label: 'Phrases' },
        { value: 'both', label: 'Both' }
      ]"
      formControlName="cardType"
    />

    <button type="submit" class="has-icon" [disabled]="isConverting() || !createLearnablesConfig()">
      Do the Magic
      <ng-icon [svg]="icons.magicIcon" size="24" />
    </button>
  </div>
</form>
