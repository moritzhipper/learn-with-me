<div class="select-wrapper" [class.user-selected]="selectedCollectionId() !== null">
  <select [(ngModel)]="selectedCollectionId">
    <option [ngValue]="null">All cards</option>
    @for (option of selectableCollections(); track option.id) {
      <option [ngValue]="option.id">{{ option.name }}</option>
    }
  </select>
  <app-icon-comp type="chevron" />
</div>

@if (selectedCollectionId()) {
  <button class="silent fly-in-x-rev" [animDelay]="{ i: 0, size: 4 }" (click)="edit.emit()">
    <app-icon-comp type="edit" />
  </button>
  <button class="silent fly-in-x-rev" [animDelay]="{ i: 1, size: 4 }" (click)="share.emit()">
    <app-icon-comp type="share-network" />
  </button>
  <button class="silent fly-in-x-rev" [animDelay]="{ i: 2, size: 4 }" (click)="download.emit()">
    <app-icon-comp type="share" />
  </button>

  <button
    class="silent delete fly-in-x-rev"
    [animDelay]="{ i: 3, size: 4 }"
    (click)="delete.emit()"
  >
    <app-icon-comp type="trash" />
  </button>
} @else {
  @let size = selectableCollections().length;
  @for (option of selectableCollections(); track option.id) {
    <button
      (click)="selectedCollectionId.set(option.id)"
      class="small fake-select fly-in-x-rev"
      [animDelay]="{
        i: $index,
        size
      }"
    >
      {{ option.name }}
    </button>
  }
}
