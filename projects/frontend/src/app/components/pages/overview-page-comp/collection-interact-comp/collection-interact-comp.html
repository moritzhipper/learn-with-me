<div class="select-wrapper" [class.user-selected]="selectedCollectionId() !== null">
  <select [(ngModel)]="selectedCollectionId">
    <option [ngValue]="null">All cards</option>
    @for (option of selectableCollections(); track option.id) {
      <option [ngValue]="option.id">{{ option.name }}</option>
    }
  </select>
  <app-icon-comp type="chevron" />
</div>

@if (selectedCollectionId()) {
  <button class="silent fly-in-x-rev-0" (click)="edit.emit()">
    <app-icon-comp type="edit" />
  </button>
  <button class="silent fly-in-x-rev-1" (click)="share.emit()">
    <app-icon-comp type="share-network" />
  </button>
  <button class="silent fly-in-x-rev-2" (click)="download.emit()">
    <app-icon-comp type="share" />
  </button>

  <button class="silent delete fly-in-x-rev-3" (click)="delete.emit()">
    <app-icon-comp type="trash" />
  </button>
} @else {
  @for (option of selectableCollections(); track option.id; let i = $index) {
    <button
      (click)="selectedCollectionId.set(option.id)"
      class="small fake-select"
      [class]="'fly-in-x-rev-' + (i + 1)"
    >
      {{ option.name }}
    </button>
  }
}
