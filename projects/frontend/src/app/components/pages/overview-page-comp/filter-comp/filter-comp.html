@let hasSelected = selectedCollectionId() !== null;
@if (!hasSelected) {
  <div class="pseudo-select" [class.user-selected]="selectedCollectionId() !== null">
    <select [(ngModel)]="selectedCollectionId">
      <option [ngValue]="null">All cards</option>
      @for (coll of collections(); track coll.id) {
        <option [ngValue]="coll.id">{{ coll.name }}</option>
      }
    </select>
    <app-icon-comp type="chevron" [size]="30" />
  </div>
  <!-- @for (coll of collections(); track coll.id) {
    <button
      (click)="selectedCollectionId.set(coll.id)"
      class="small fly-in-x-wide"
      [animDelay]="{ i: $index, list: collections() }"
    >
      {{ coll.name }}
    </button>
  } -->
} @else {
  <button (click)="selectedCollectionId.set(null)" class="small icon-only close">
    <app-icon-comp class="icon" type="close" [size]="28" />
  </button>
  <button
    class="small chip fly-in-x-wide"
    [animDelay]="{ i: 0, size: 4 }"
    (click)="onAction.emit('edit')"
  >
    <app-icon-comp type="edit" class="icon" />
  </button>
  <button
    class="small chip fly-in-x-wide"
    [animDelay]="{ i: 1, size: 4 }"
    (click)="onAction.emit('share')"
  >
    <app-icon-comp type="share-network" class="icon" />
  </button>
  <button
    class="small chip fly-in-x-wide"
    [animDelay]="{ i: 2, size: 4 }"
    (click)="onAction.emit('download')"
  >
    <app-icon-comp type="share" class="icon" />
  </button>
  <button
    class="small chip delete fly-in-x-wide"
    [animDelay]="{ i: 3, size: 4 }"
    (click)="onAction.emit('delete')"
  >
    <app-icon-comp type="trash" class="icon" />
  </button>
}
