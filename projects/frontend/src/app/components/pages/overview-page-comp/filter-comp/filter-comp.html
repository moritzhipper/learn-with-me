@let hasSelected = selectedCollectionId() !== null;

@if (!hasSelected) {
  <div class="pseudo-select" [class.user-selected]="selectedCollectionId() !== null">
    <select [(ngModel)]="selectedCollectionId">
      <option [ngValue]="null">All cards</option>
      @for (coll of collections(); track coll.item.id) {
        <option [ngValue]="coll.item.id">{{ coll.item.name }}</option>
      }
    </select>
    <app-icon-comp type="chevron" [size]="30" />
  </div>
  <div class="collections">
    @for (coll of collections(); track coll.item.id) {
      <button
        (click)="selectedCollectionId.set(coll.item.id)"
        class="small fly-in-x-wide"
        [style.animationDelay.s]="coll.animDelay"
      >
        {{ coll.item.name }}
      </button>
    }
  </div>
  <button class="small icon-only filter">
    <app-icon-comp type="filter" class="icon" [size]="20" />
  </button>
} @else {
  <button (click)="selectedCollectionId.set(null)" class="small icon-only interact">
    <app-icon-comp class="icon" type="close" [size]="30" />
  </button>
  <button class="small icon-only chip">
    <app-icon-comp type="edit" class="icon" />
  </button>
  <button class="small icon-only chip">
    <app-icon-comp type="share-network" class="icon" />
  </button>
  <button class="small icon-only chip">
    <app-icon-comp type="share" class="icon" />
  </button>
  <button class="small icon-only chip delete">
    <app-icon-comp type="trash" class="icon" />
  </button>
}
