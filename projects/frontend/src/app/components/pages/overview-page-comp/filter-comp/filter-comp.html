@let hasSelected = selectedCollectionId() !== null;
@if (!hasSelected) {
  <div class="pseudo-select" [class.user-selected]="selectedCollectionId() !== null">
    <select [(ngModel)]="selectedCollectionId">
      <option [ngValue]="null">All cards</option>
      @for (coll of collections(); track coll.id) {
        <option [ngValue]="coll.id">{{ coll.name }}</option>
      }
    </select>
    <app-icon-comp type="chevron" class="icon" />
  </div>
  <div lizAnimDelayWrapper applyClass="fly-in-x-wide" style="display: contents">
    @for (coll of collections(); track coll.id) {
      <button (click)="selectedCollectionId.set(coll.id)" class="silent chip" #animItem>
        {{ coll.name }}
      </button>
    }
  </div>
} @else {
  <button (click)="selectedCollectionId.set(null)" class="silent chip all">
    <app-icon-comp type="chevron" class="chevron" />
    All
  </button>
  <div lizAnimDelayWrapper applyClass="fly-in-x-wide" style="display: contents">
    <button class="silent chip icon-only" #animItem (click)="onAction.emit('share')">
      Share
      <app-icon-comp type="share-network" class="icon" />
    </button>
    <button class="silent chip icon-only" #animItem (click)="onAction.emit('edit')">
      Edit
      <app-icon-comp type="edit" class="icon" />
    </button>

    <button class="silent chip icon-only" #animItem (click)="onAction.emit('download')">
      Download
      <app-icon-comp type="share" class="icon" />
    </button>
    <button class="silent chip icon-only delete" #animItem (click)="onAction.emit('delete')">
      Remove
      <app-icon-comp type="trash" class="icon" />
    </button>
  </div>
}
