@let la = learnable();
@let isUserlearnable = 'guesses' in la;
<button
  class="wrapper silent"
  [class]="{
    'small-text': hasManyLetters(),
    selected: isSelected()
  }"
  (click)="onSelect.emit()"
>
  <p class="lexeme">
    {{ la.lexeme }}
  </p>
  <p class="translation">
    {{ la.translation }}
  </p>
  <p class="notes">
    {{ la.notes }}
  </p>
  <div class="info">
    <span class="word-list-item"> {{ la.createdAt | date: 'mediumDate' }} </span>
    <span class="word-list-item">
      {{ la.type }}
    </span>
  </div>
  @if (isUserlearnable) {
    <div class="last-guesses">
      <div class="guesses lexeme">
        @for (guess of la.guesses.lexeme; track $index) {
          @if (guess) {
            <div class="right"></div>
          } @else {
            <div class="wrong"></div>
          }
        }
      </div>
      <div class="guesses translation">
        @for (guess of la.guesses.translation; track $index) {
          @if (guess) {
            <div class="right"></div>
          } @else {
            <div class="wrong"></div>
          }
        }
      </div>
    </div>
  }
</button>
